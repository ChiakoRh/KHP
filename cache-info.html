<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cache Manager - Monogatari</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: white;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      border: none;
      border-radius: 4px;
    }
    .btn-primary { background: #4c6a52; color: white; }
    .btn-danger { background: #f26d5b; color: white; }
    pre {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Cache Manager</h1>
  
  <button id="view-cache" class="btn-primary">View Cached Files</button>
  <button id="clear-cache" class="btn-danger">Clear All Cache</button>
  <button id="preload-images" class="btn-primary">Preload Hanekawa Images</button>
  
  <h3>Cache Status:</h3>
  <pre id="cache-status">Click "View Cached Files" to see what's cached...</pre>

  <script>
    const CACHE_NAME = 'monogatari-cache-v1';
    
    document.getElementById('view-cache').addEventListener('click', async () => {
      if (!('caches' in window)) {
        document.getElementById('cache-status').textContent = 'Cache API not supported';
        return;
      }
      
      const cache = await caches.open(CACHE_NAME);
      const keys = await cache.keys();
      
      if (keys.length === 0) {
        document.getElementById('cache-status').textContent = 'No files cached yet.';
        return;
      }
      
      let output = `Total cached: ${keys.length} files\n\n`;
      keys.forEach((request, i) => {
        output += `${i + 1}. ${request.url.split('/').pop()}\n`;
      });
      document.getElementById('cache-status').textContent = output;
    });
    
    document.getElementById('clear-cache').addEventListener('click', async () => {
      if (!('caches' in window)) return;
      
      if (confirm('Clear all cached files? Next load will be slower until recached.')) {
        await caches.delete(CACHE_NAME);
        document.getElementById('cache-status').textContent = 'Cache cleared!';
        console.log('Cache cleared');
      }
    });
    
    document.getElementById('preload-images').addEventListener('click', async () => {
      const images = ['assets/images/hanekawa1.png', 'assets/images/hanekawa2.png', 'assets/images/hanekawa3.png'];
      const cache = await caches.open(CACHE_NAME);
      
      for (const img of images) {
        const response = await fetch(img);
        if (response.ok) {
          await cache.put(img, response);
          console.log(`Cached: ${img}`);
        }
      }
      document.getElementById('cache-status').textContent = 'Images preloaded!';
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ougi - Monogatari Start Page</title>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#000000" />
    <script src="../js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-image: url("../assets/images/ougi_light.png");
        --bg-color: #d8d8d8;
        --text-primary: #000000;
        --text-inverse: #ffffff;
        --layout-justify: flex-end;
        --panel-align: flex-end;
        --text-align: right;
      }

      [data-theme="dark"] {
        --bg-image: url("../assets/images/ougi_dark.png");
        --bg-color: #111111;
        --text-primary: #ffffff;
        --text-inverse: #000000;
        --layout-justify: flex-start;
        --panel-align: flex-start;
        --text-align: left;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Space Grotesk", sans-serif;
        background-color: var(--bg-color);
        background-image: var(--bg-image);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0s;
      }

      .layout {
        display: flex;
        justify-content: var(--layout-justify);
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 40px 8vw;
      }

      .ui-panel {
        display: flex;
        flex-direction: column;
        align-items: var(--panel-align);
        text-align: var(--text-align);
        gap: 20px;
        width: 100%;
        max-width: 500px;
      }

      .time {
        font-size: clamp(80px, 8vw, 120px);
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: -4px;
        color: var(--text-primary);
      }

      .meta-data {
        font-size: 18px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        display: flex;
        gap: 15px;
      }

      .greeting {
        background: var(--text-primary);
        color: var(--text-inverse);
        padding: 5px 15px;
        font-weight: 900;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .search-wrapper {
        width: 100%;
        margin-top: 20px;
      }

      .search {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 4px solid var(--text-primary);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 24px;
        font-weight: 700;
        padding: 10px 0;
        outline: none;
        text-align: var(--text-align);
        transition: all 0.1s linear;
      }

      .search::placeholder {
        color: var(--text-primary);
        opacity: 0.3;
      }

      .search:focus {
        background: var(--text-primary);
        color: var(--text-inverse);
        padding: 10px 15px;
      }

      .search:focus::placeholder {
        color: var(--text-inverse);
        opacity: 0.5;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        width: 100%;
        margin-top: 10px;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--text-primary);
        color: var(--text-inverse);
        text-decoration: none;
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        border: 2px solid var(--text-primary);
        transition:
          background 0.1s,
          color 0.1s;
      }

      .link:hover {
        background: transparent;
        color: var(--text-primary);
      }

      .link svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2.5;
        fill: none;
      }

      .btn-settings {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 50px;
        height: 50px;
        background: transparent;
        border: 2px solid var(--text-primary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: all 0.1s;
      }

      [data-theme="dark"] .btn-settings {
        right: auto;
        left: 40px;
      }

      .btn-settings svg {
        width: 24px;
        height: 24px;
        stroke: var(--text-primary);
        stroke-width: 2;
        fill: none;
      }

      .btn-settings:hover {
        background: var(--text-primary);
      }

      .btn-settings:hover svg {
        stroke: var(--text-inverse);
      }

      #settings-shell {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="ui-panel">
        <div class="time" id="clock">00:00</div>

        <div class="meta-data">
          <span id="date">YYYY.MM.DD</span>
          <span>|</span>
          <span id="weather">--°C</span>
        </div>

        <div class="greeting" id="greeting">Hello</div>

        <div class="search-wrapper">
          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search..."
            autocomplete="off"
            autofocus
          />
        </div>

        <nav class="links" id="links"></nav>
      </div>
    </div>

    <button class="btn-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        ></path>
      </svg>
    </button>

    <script src="../js/core.js"></script>
    <script src="../js/settings.js"></script>
  </body>
</html>

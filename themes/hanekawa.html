<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hanekawa - Monogatari Start Page</title>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#4c6a52" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --art-black: #1a1a1a;
        --art-white: #ffffff;
        --art-orange: #f26d5b;
        --art-yellow: #f9d800;
        --ui-border: 4px solid var(--art-black);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Space Grotesk", sans-serif;
        color: var(--art-black);
        height: 100vh;
        overflow: hidden;
        background-size: cover;
        background-position: 50% 35%;
        background-repeat: no-repeat;
        transition: background-image 0.5s ease-in-out;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px;
      }

      #flash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--art-black);
        color: var(--art-white);
        opacity: 1;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #flash-text {
        font-size: clamp(60px, 10vw, 120px);
        font-weight: 900;
        letter-spacing: -2px;
        text-transform: uppercase;
        background: var(--art-black);
        padding: 0 20px;
        border: 8px solid var(--art-white);
      }

      .top-left {
        align-self: flex-start;
        display: flex;
        gap: 20px;
      }

      .time-block {
        background: var(--art-white);
        border: var(--ui-border);
        padding: 15px 25px;
        box-shadow: 8px 8px 0 var(--art-black);
      }

      .time {
        font-size: 64px;
        font-weight: 900;
        line-height: 0.85;
        letter-spacing: -3px;
      }

      .date {
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--art-orange);
        margin-top: 8px;
        letter-spacing: 2px;
      }

      .weather {
        background: var(--art-black);
        color: var(--art-white);
        border: 4px solid var(--art-white);
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        box-shadow: 8px 8px 0 var(--art-orange);
      }

      .weather svg {
        width: 32px;
        height: 32px;
        stroke: var(--art-yellow);
        stroke-width: 2.5;
        fill: none;
      }

      .weather-temp {
        font-size: 18px;
        font-weight: 900;
      }

      .bottom-right {
        align-self: flex-end;
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .quote-box {
        align-self: flex-end;
        background: var(--art-black);
        color: var(--art-white);
        padding: 10px 20px;
        font-weight: 700;
        font-size: 16px;
        border-left: 8px solid var(--art-yellow);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: auto;
      }

      .quote-box:hover {
        opacity: 1;
        transform: translateY(0);
      }

      .search-wrapper {
        width: 100%;
      }

      .search {
        width: 100%;
        padding: 20px 24px;
        background: var(--art-white);
        border: var(--ui-border);
        color: var(--art-black);
        font-size: 20px;
        font-family: inherit;
        font-weight: 700;
        outline: none;
        box-shadow: 8px 8px 0 var(--art-black);
        transition: all 0.1s;
      }

      .search::placeholder {
        color: #aaa;
        font-weight: 700;
        text-transform: uppercase;
      }

      .search:focus {
        border-color: var(--art-orange);
        box-shadow: 4px 4px 0 var(--art-orange);
        transform: translate(4px, 4px);
      }

      .links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 16px;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px;
        color: var(--art-black);
        text-decoration: none;
        font-size: 15px;
        font-weight: 900;
        text-transform: uppercase;
        background: var(--art-white);
        border: var(--ui-border);
        box-shadow: 6px 6px 0 var(--art-black);
        transition: all 0.1s;
      }

      .link:hover {
        background: var(--art-yellow);
        transform: translate(4px, 4px);
        box-shadow: 2px 2px 0 var(--art-black);
      }

      .link:nth-child(1):hover,
      .link:nth-child(3):hover {
        background: var(--art-orange);
        color: var(--art-white);
      }

      #settings-shell {
        display: contents;
      }

      .icon {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2.5;
        fill: none;
      }
    </style>
  </head>
  <body>
    <div id="flash-overlay">
      <div id="flash-text">HAN E KA WA</div>
    </div>

    <div class="top-left">
      <div class="time-block">
        <div class="time" id="clock">00:00</div>
        <div class="date" id="date">YYYY.MM.DD</div>
      </div>
      <div class="weather" id="weather">
        <span id="wx-icon"></span>
        <span class="weather-temp" id="wx-temp">--°</span>
      </div>
    </div>

    <div class="bottom-right">
      <div class="quote-box">
        　「何でもは知らないわよ。<br />知ってることだけ」
      </div>
      <div class="search-wrapper">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search..."
          autocomplete="off"
          autofocus
        />
      </div>

      <nav class="links" id="links">
        <a class="link" id="settings-btn" style="cursor: pointer">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"
            />
          </svg>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/hanekawa.js"></script>
  </body>
</html>

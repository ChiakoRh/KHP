<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Hanekawa - Monogatari Start Page</title>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#030303" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --void: #030303;
        --silver: #e2e8f0;
        --gold: #ffbe0b;
        --gold-dim: rgba(255, 190, 11, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Space Grotesk", sans-serif;
        background-color: var(--void);
        color: var(--silver);
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .media-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("../assets/images/black_hanekawa.gif");
        background-size: cover;
        background-position: center;
      }

      .media-layer video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(0.3) contrast(1.2);
      }

      .frame-cut {
        position: fixed;
        inset: 0;
        background: var(--void);
        z-index: 9999;
        pointer-events: none;
        animation: shaftBlink 0.6s cubic-bezier(0.8, 0, 0.2, 1) forwards;
      }

      @keyframes shaftBlink {
        0% { opacity: 1; }
        40% { opacity: 1; background: var(--silver); }
        45% { opacity: 0; }
        50% { opacity: 1; background: var(--void); }
        100% { opacity: 0; display: none; }
      }

      .letterbox {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 10;
        background: var(--void);
        height: 80px;
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0 50px;
      }

      .letterbox.top {
        top: 0;
        justify-content: space-between;
        border-bottom: 1px solid var(--gold-dim);
      }

      .letterbox.bottom {
        bottom: 0;
        justify-content: center;
        border-top: 1px solid var(--gold-dim);
      }

      .time-container {
        display: flex;
        align-items: baseline;
        gap: 20px;
      }

      .time {
        font-family: "Cormorant Garamond", serif;
        font-size: 56px;
        font-weight: 700;
        color: var(--silver);
        line-height: 1;
        letter-spacing: -1px;
      }

      .date {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--gold);
      }

      .search-container {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-input {
        background: rgba(3, 3, 3, 0.8);
        border: 1px solid var(--gold-dim);
        border-bottom: 2px solid var(--gold);
        color: var(--silver);
        padding: 12px 45px 12px 20px;
        width: 320px;
        font-family: inherit;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 2px;
        outline: none;
        text-transform: uppercase;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .search-input::placeholder {
        color: rgba(226, 232, 240, 0.3);
      }

      .search-input:focus {
        background: #f3e7da66;
        color: var(--void);
        border-color: var(--gold);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      }

      .search-input:focus::placeholder {
        color: rgba(3, 3, 3, 0.4);
      }

      .paw-icon {
        position: absolute;
        right: 15px;
        width: 20px;
        height: 20px;
        fill: var(--gold-dim);
        pointer-events: none;
        transition: fill 0.2s;
      }

      .search-input:focus ~ .paw-icon {
        fill: var(--void);
      }

      .weather {
        position: absolute;
        left: 50px;
        font-family: "Cormorant Garamond", serif;
        font-size: 28px;
        font-style: italic;
        color: var(--silver);
      }

      .nav-links {
        display: flex;
        gap: 60px;
      }

      .link {
        position: relative;
        color: var(--silver);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 10px 0;
        overflow: hidden;
      }

      .link::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--gold);
        transform: scaleY(1);
        transform-origin: bottom;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: -1;
      }

      .link:hover {
        color: var(--void);
      }

      .link:hover::before {
        transform: scaleY(20);
      }

      .settings-btn {
        position: fixed;
        bottom: 9px;
        right: 20px;
        width: 44px;
        height: 44px;
        cursor: pointer;
        z-index: 10000;
        background: transparent;
        border: none;
        padding: 0;
        opacity: 0.5;
        transition: opacity 0.3s;
      }
      .settings-btn:hover {
        opacity: 1;
      }
      .settings-btn svg {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame-cut"></div>

    <div class="media-layer">
      <video autoplay loop muted playsinline id="bg-video">
        <source src="../assets/videos/hanekawa.mp4" type="video/mp4" />
        <source src="../assets/videos/hanekawa.mkv" type="video/x-matroska" />
      </video>
    </div>

    <div class="letterbox top">
      <div class="time-container">
        <div class="time" id="clock">00:00</div>
        <div class="date" id="date">YYYY.MM.DD</div>
      </div>

      <div class="search-container">
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="SEARCH"
          autocomplete="off"
          autofocus
        />
        <svg class="paw-icon" viewBox="0 0 24 24">
          <polygon points="12,13 17,17 14,22 10,22 7,17" />
          <polygon points="12,4 14,7 12,10 10,7" />
          <polygon points="6,6 8,9 5,11 3,8" />
          <polygon points="18,6 21,8 19,11 16,9" />
        </svg>
      </div>
    </div>

    <div class="letterbox bottom">
      <div class="weather" id="weather">--°C</div>
      <nav class="nav-links" id="links"></nav>
    </div>

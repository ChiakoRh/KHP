<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsukihi - Monogatari Start Page</title>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#006a66" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --md-sys-color-primary: #006a66;
        --md-sys-color-primary-container: #a0efeb;
        --md-sys-color-on-primary-container: #00201f;

        --md-sys-color-secondary: #ab333c;
        --md-sys-color-secondary-container: #ffdad5;
        --md-sys-color-tsukihi-blue: #a4d7f3;
        --md-sys-color-on-secondary-container: #410001;

        --md-sys-color-tertiary: #745b00;
        --md-sys-color-tertiary-container: #ffdf99;
        --md-sys-color-on-tertiary-container: #251a00;

        --md-sys-color-surface: #f8fbfb;
        --md-sys-color-on-surface: #191c1c;
        --md-sys-color-surface-variant: #dae5e4;
        --md-sys-color-on-surface-variant: #3f4948;
        --md-sys-color-outline: #6f7978;

        --shape-leaf-1: 160px 24px 160px 24px;
        --shape-leaf-2: 24px 160px 24px 160px;
        --shape-dome: 160px 160px 24px 24px;
        --shape-pill: 9999px;
        --shape-chip: 16px;

        --md-sys-state-hover: 0.08;
        --md-sys-state-pressed: 0.12;
      }

      [data-theme="dark"] {
        --md-sys-color-primary: #4cdade;
        --md-sys-color-primary-container: #004f4c;
        --md-sys-color-on-primary-container: #a0efeb;

        --md-sys-color-secondary: #ffb4ab;
        --md-sys-color-secondary-container: #851b27;
        --md-sys-color-on-secondary-container: #ffdad5;

        --md-sys-color-tertiary: #e6c25c;
        --md-sys-color-tertiary-container: #584400;
        --md-sys-color-on-tertiary-container: #ffdf99;

        --md-sys-color-surface: #101414;
        --md-sys-color-on-surface: #dfeceb;
        --md-sys-color-surface-variant: #2d3636;
        --md-sys-color-on-surface-variant: #b0c0bf;
        --md-sys-color-outline: #899392;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-family: "Outfit", sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .font-display {
        font-family: "Fraunces", serif;
        font-variation-settings:
          "SOFT" 100,
          "opsz" 144;
      }

      .interactive {
        position: relative;
        overflow: hidden;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        isolation: isolate;
      }

      .state-layer {
        position: absolute;
        inset: 0;
        background-color: currentColor;
        opacity: 0;
        transition: opacity 0.15s linear;
        z-index: 1;
        pointer-events: none;
      }

      .interactive:hover > .state-layer {
        opacity: var(--md-sys-state-hover);
      }
      .interactive:active > .state-layer {
        opacity: var(--md-sys-state-pressed);
      }

      .ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: ripple-animation 0.4s cubic-bezier(0.2, 0, 0, 1);
        background-color: currentColor;
        opacity: 0.16;
        z-index: 0;
        pointer-events: none;
      }

      @keyframes ripple-animation {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      .bento-wrapper {
        width: 100%;
        max-width: 1300px;
        padding: 2rem;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1.5rem;
        grid-auto-rows: minmax(100px, auto);
      }

      .time-block {
        grid-column: 1 / 8;
        grid-row: span 3;
        background-color: var(--md-sys-color-tertiary-container);
        color: var(--md-sys-color-on-tertiary-container);
        border-radius: var(--shape-leaf-2);
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition:
          border-radius 0.4s cubic-bezier(0.2, 0, 0, 1),
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .time-block:hover {
        border-radius: var(--shape-dome);
      }

      .greeting {
        font-family: "Outfit", sans-serif;
        font-size: 1.5rem;
        font-weight: 500;
        opacity: 0.8;
        margin-bottom: 0.5rem;
        letter-spacing: -0.5px;
      }

      .time {
        font-size: clamp(5rem, 8vw, 8rem);
        font-weight: 300;
        line-height: 0.85;
        letter-spacing: -0.04em;
        margin-bottom: 0.5rem;
      }

      .date-weather {
        display: flex;
        gap: 1rem;
        align-items: center;
        font-size: 1.25rem;
        font-weight: 500;
        margin-top: 1rem;
      }

      .weather-pill {
        background-color: var(--md-sys-color-tertiary);
        color: var(--md-sys-color-surface);
        padding: 0.25rem 1rem;
        border-radius: var(--shape-pill);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .media-block {
        grid-column: 8 / -1;
        grid-row: span 5;
        background-color: var(--md-sys-color-primary-container);
        border-radius: var(--shape-leaf-1);
        position: relative;
        overflow: hidden;
        transition:
          border-radius 0.4s cubic-bezier(0.2, 0, 0, 1),
          transform 0.4s cubic-bezier(0.2, 0, 0, 1),
          background-color 0.3s ease;
        will-change: border-radius, transform;
      }

      .media-block:hover {
        border-radius: var(--shape-leaf-2);
        transform: scale(1.02);
      }

      .media-block video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.01);
        pointer-events: none;
      }

      .search-block {
        grid-column: 1 / 8;
        grid-row: span 1;
        position: relative;
        display: flex;
      }

      .search-input {
        width: 100%;
        height: 100%;
        background-color: var(--md-sys-color-surface-variant);
        color: var(--md-sys-color-on-surface-variant);
        border: none;
        border-radius: var(--shape-pill);
        padding: 0 3rem;
        font-family: "Outfit", sans-serif;
        font-size: 1.5rem;
        font-weight: 500;
        outline: none;
        transition:
          background-color 0.25s cubic-bezier(0.2, 0, 0, 1),
          color 0.25s cubic-bezier(0.2, 0, 0, 1),
          border-radius 0.3s cubic-bezier(0.2, 0, 0, 1),
          transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.25s cubic-bezier(0.2, 0, 0, 1);
        will-change: transform, border-radius, box-shadow;
      }

      .search-input::placeholder {
        color: var(--md-sys-color-outline);
        font-weight: 400;
      }

      .search-input:hover:not(:focus) {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }

      .search-input:focus {
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
        border-radius: 24px;
        transform: translateY(-4px) scale(1.005);
        box-shadow:
          0 12px 28px rgba(0, 106, 102, 0.15),
          0 4px 8px rgba(0, 0, 0, 0.06);
      }

      .search-input:active {
        transform: translateY(1px) scale(0.998);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        transition-duration: 0.1s;
      }

      .links-block {
        grid-column: 1 / 8;
        grid-row: span 1;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .link-chip {
        height: 56px;
        padding: 0 1.5rem;
        border-radius: var(--shape-chip);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.125rem;
        font-weight: 500;
        text-decoration: none;
        color: var(--md-sys-color-on-surface);
        border: 1px solid var(--md-sys-color-outline);
        background: transparent;
        transition:
          all 0.2s cubic-bezier(0.2, 0, 0, 1),
          color 0.3s ease,
          border-color 0.3s ease,
          background-color 0.3s ease;
        will-change: transform, border-radius, box-shadow;
      }

      .link-chip:hover {
        border-radius: 8px;
        transform: translateY(-4px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      }

      .link-chip:active {
        transform: translateY(0) scale(0.96);
        box-shadow: none;
        transition-duration: 0.1s;
      }

      .link-chip span {
        position: relative;
        z-index: 2;
      }

      .link-chip.coral {
        background-color: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container);
        border-color: transparent;
      }

      .link-chip.teal {
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
        border-color: transparent;
      }

      .settings-btn {
        position: fixed;
        bottom: 28px;
        left: 28px;
        width: 64px;
        height: 64px;
        background: none;
        border: none;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        cursor: pointer;
        outline: none;
        transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      .settings-btn:hover {
        transform: rotate(90deg);
      }

      .settings-btn:active {
        transform: rotate(45deg) scale(0.9);
        transition-duration: 0.12s;
      }

      .settings-btn .btn-shape {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .settings-btn .btn-shape path {
        fill: var(--md-sys-color-tsukihi-blue);
        d: path("M32.0,2.0L34.3,2.3L36.5,3.3L38.5,4.8L40.2,6.8L41.6,8.9L42.6,11.1L43.5,13.2L44.3,15.0L45.1,16.6L46.1,17.9L47.4,18.9L49.0,19.7L50.8,20.5L52.9,21.4L55.1,22.4L57.2,23.8L59.2,25.5L60.7,27.5L61.7,29.7L62.0,32.0L61.7,34.3L60.7,36.5L59.2,38.5L57.2,40.2L55.1,41.6L52.9,42.6L50.8,43.5L49.0,44.3L47.4,45.1L46.1,46.1L45.1,47.4L44.3,49.0L43.5,50.8L42.6,52.9L41.6,55.1L40.2,57.2L38.5,59.2L36.5,60.7L34.3,61.7L32.0,62.0L29.7,61.7L27.5,60.7L25.5,59.2L23.8,57.2L22.4,55.1L21.4,52.9L20.5,50.8L19.7,49.0L18.9,47.4L17.9,46.1L16.6,45.1L15.0,44.3L13.2,43.5L11.1,42.6L8.9,41.6L6.8,40.2L4.8,38.5L3.3,36.5L2.3,34.3L2.0,32.0L2.3,29.7L3.3,27.5L4.8,25.5L6.8,23.8L8.9,22.4L11.1,21.4L13.2,20.5L15.0,19.7L16.6,18.9L17.9,17.9L18.9,16.6L19.7,15.0L20.5,13.2L21.4,11.1L22.4,8.9L23.8,6.8L25.5,4.8L27.5,3.3L29.7,2.3Z");
        transition:
          d 0.4s cubic-bezier(0.34, 1.4, 0.64, 1),
          fill 0.3s ease;
      }

      .settings-btn:hover .btn-shape path {
        d: path("M32.0,10.0L33.8,9.7L35.7,8.8L37.8,7.7L40.2,6.7L42.7,6.2L45.1,6.3L47.1,7.3L48.7,9.1L49.6,11.4L50.0,14.0L50.2,16.5L50.3,18.7L50.8,20.5L51.8,21.9L53.3,23.2L55.2,24.5L57.3,25.9L59.2,27.7L60.5,29.8L61.0,32.0L60.5,34.2L59.2,36.3L57.3,38.1L55.2,39.5L53.3,40.8L51.8,42.1L50.8,43.5L50.3,45.3L50.2,47.5L50.0,50.0L49.6,52.6L48.7,54.9L47.1,56.7L45.1,57.7L42.7,57.8L40.2,57.3L37.8,56.3L35.7,55.2L33.8,54.3L32.0,54.0L30.2,54.3L28.3,55.2L26.2,56.3L23.8,57.3L21.3,57.8L18.9,57.7L16.9,56.7L15.3,54.9L14.4,52.6L14.0,50.0L13.8,47.5L13.7,45.3L13.2,43.5L12.2,42.1L10.7,40.8L8.8,39.5L6.7,38.1L4.8,36.3L3.5,34.2L3.0,32.0L3.5,29.8L4.8,27.7L6.7,25.9L8.8,24.5L10.7,23.2L12.2,21.9L13.2,20.5L13.7,18.7L13.8,16.5L14.0,14.0L14.4,11.4L15.3,9.1L16.9,7.3L18.9,6.3L21.3,6.2L23.8,6.7L26.2,7.7L28.3,8.8L30.2,9.7Z");
        fill: var(--md-sys-color-secondary);
      }

      .settings-btn .btn-icon {
        position: relative;
        z-index: 2;
        width: 22px;
        height: 22px;
        stroke: var(--md-sys-color-on-secondary-container);
        stroke-width: 2.5;
        fill: none;
        transition:
          transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1),
          stroke 0.3s ease;
        pointer-events: none;
      }

      .settings-btn:hover .btn-icon {
        transform: rotate(-90deg);
        stroke: var(--md-sys-color-surface);
      }

      .settings-btn:active .btn-icon {
        transform: rotate(-45deg);
      }

      [data-theme="dark"] .settings-btn .btn-icon {
        stroke: var(--md-sys-color-surface-variant);
      }

      @media (max-width: 1024px) {
        .time-block,
        .search-block,
        .links-block {
          grid-column: 1 / -1;
        }
        .media-block {
          grid-column: 1 / -1;
          height: 400px;
          grid-row: auto;
        }
      }
    </style>
  </head>
  <body>
    <button
      id="open-settings-btn"
      class="settings-btn"
      aria-label="Open Settings"
    >
      <svg
        class="btn-shape"
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path />
      </svg>
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        ></path>
      </svg>
    </button>

    <div class="bento-wrapper">
      <div class="time-block interactive" tabindex="0">
        <div class="state-layer"></div>
        <div class="greeting" id="greeting">welcome back, user.</div>
        <div class="font-display time" id="clock">00:00</div>
        <div class="date-weather">
          <span class="weather-pill" id="weather">--°</span>
          <span id="date">Month 00, YYYY</span>
        </div>
      </div>

      <div class="media-block interactive" tabindex="0">
        <div class="state-layer"></div>
        <video autoplay loop muted playsinline poster="../assets/images/tsukihi.png">
          <source src="../assets/videos/tsukihi.mp4" type="video/mp4" />
          <source src="../assets/videos/tsukihi.mkv" type="video/x-matroska" />
        </video>
      </div>

      <div class="search-block">
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="type to search..."
          autocomplete="off"
          autofocus
        />
      </div>

      <nav class="links-block" id="links"></nav>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/settings.js"></script>
  </body>
</html>
